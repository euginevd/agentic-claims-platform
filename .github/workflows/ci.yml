name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync --locked
      - name: Lint and security rules (ruff, including bandit)
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Tests (stub model, no AWS)
        run: uv run pytest -q
