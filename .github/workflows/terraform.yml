name: terraform

on:
  push:
    branches: [main]
    paths: ["infra/**", "app/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["infra/**", "app/**", ".github/workflows/terraform.yml"]
  # Manual spin-up and tear-down: Actions → terraform → Run workflow (from main).
  workflow_dispatch:
    inputs:
      action:
        description: "up = deploy dev, down = destroy dev"
        type: choice
        options: [up, down]
        default: up

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  WORKDIR: infra/terraform/envs/dev

jobs:
  # Runs on every change, with no AWS access.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/envs/dev; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - uses: terraform-linters/setup-tflint@v4
      - name: Lint (tflint)
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - name: Security scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true

  # Plans with the read-only role. Skipped until the AWS variables are set (docs/DEPLOY.md).
  plan:
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_model_id: ${{ vars.MODEL_ID }}
      TF_VAR_bedrock_model_arns: ${{ vars.BEDROCK_MODEL_ARNS }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-2
      - uses: hashicorp/setup-terraform@v4
      - name: Init
        run: terraform -chdir="$WORKDIR" init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Plan
        run: |
          terraform -chdir="$WORKDIR" plan -input=false -no-color -out=tfplan | tee plan.txt
          { echo '### Terraform plan (dev)'; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Deploys only when you press "up", from main, through the "dev" environment.
  # Merges don't deploy, so nothing is left running by accident.
  apply:
    if: inputs.action == 'up' && vars.AWS_APPLY_ROLE_ARN != ''
    needs: static
    runs-on: ubuntu-latest
    environment: dev
    concurrency: terraform-dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_model_id: ${{ vars.MODEL_ID }}
      TF_VAR_bedrock_model_arns: ${{ vars.BEDROCK_MODEL_ARNS }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - uses: hashicorp/setup-terraform@v4
      - name: Init
        run: terraform -chdir="$WORKDIR" init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Apply
        run: terraform -chdir="$WORKDIR" apply -input=false -auto-approve

  # Tears dev down when you press "down". The bootstrap (state bucket, roles, budget) stays.
  destroy:
    if: inputs.action == 'down' && vars.AWS_APPLY_ROLE_ARN != ''
    needs: static
    runs-on: ubuntu-latest
    environment: dev
    concurrency: terraform-dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_model_id: ${{ vars.MODEL_ID }}
      TF_VAR_bedrock_model_arns: ${{ vars.BEDROCK_MODEL_ARNS }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - uses: hashicorp/setup-terraform@v4
      - name: Init
        run: terraform -chdir="$WORKDIR" init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Destroy
        run: terraform -chdir="$WORKDIR" destroy -input=false -auto-approve
